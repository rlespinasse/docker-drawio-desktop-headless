---
name: Build And Release

on:
  pull_request:
  push:
    branches:
      - v1.x

permissions:
  contents: read # Default to 'read' for security
  pull-requests: read
  id-token: write # Added for potential OIDC in release job (packages/registry login)

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # For stefanzweifel/git-auto-commit-action
      pull-requests: write # For peter-evans/create-or-update-comment

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: true

    steps:
      - name: Checkout Source Branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}
          token: ${{ secrets.GH_TOKEN }}

      - uses: rlespinasse/github-slug-action@v5

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build Docker Image
        run: just build
        env:
          DOCKER_IMAGE: ${{ github.repository }}:${{ env.GITHUB_REF_SLUG }}

      - name: Setup CI for test
        run: just test-ci-setup

      - name: Test Docker Image
        id: test_ci
        run: just test-ci
        env:
          DOCKER_IMAGE: ${{ github.repository }}:${{ env.GITHUB_REF_SLUG }}
        continue-on-error: true

      - name: Store Output Logs & Files
        if: steps.test_ci.outcome == 'failure'
        uses: actions/upload-artifact@v5
        with:
          name: test-artifacts
          path: |
            tests/output/*.log
            tests/data
            !tests/data/*.drawio
            !tests/data/*/*.drawio

      - name: Patch Code (if Test Failed)
        if: steps.test_ci.outcome == 'failure'
        run: just patch

      - name: Generate Patch Diff
        if: steps.test_ci.outcome == 'failure'
        id: patch_diff_step
        run: |
          git diff HEAD^ HEAD > patch.diff
          # Set output to be used by the comment action
          {
            echo "diff<<EOF"
            cat patch.diff
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment Patch Diff on PR
        uses: peter-evans/create-or-update-comment@v4
        if: steps.test_ci.outcome == 'failure' && github.event_name == 'pull_request' && steps.patch_diff_step.outputs.diff != ''
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            :warning: A patch has been applied following the tests failure.

            <details>
            <summary>Display patch content</summary>

            ```diff
            ${{ steps.patch_diff_step.outputs.diff }}
            ```
            </details>
        continue-on-error: true

      - name: Commit and Push Patch (if needed)
        uses: stefanzweifel/git-auto-commit-action@v5
        if: steps.test_ci.outcome == 'failure'
        with:
          commit_message: "fix: apply automated patch after tests failure"
          branch: ${{ github.head_ref }}

  build-multiarch:
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-multiarch-${{ github.event_name }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v6

      - uses: rlespinasse/github-slug-action@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: "arm64,arm"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build Docker Image
        run: just build-multiarch
        env:
          DOCKER_IMAGE: ${{ github.repository }}:${{ env.GITHUB_REF_SLUG }}

  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required for releases
      packages: write # Required to push packages/images to GHCR
      issues: write # If release-that creates issues

    needs:
      - build
      - build-multiarch

    # Concurrency is good here, but cancellation should be disabled so a push
    # doesn't cancel a running release.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6

      - name: Release this docker image
        uses: rlespinasse/release-that@v1
        with:
          github-token: ${{ secrets.GH_TOKEN }}
