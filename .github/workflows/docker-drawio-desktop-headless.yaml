---
name: Build And Release

on:
  pull_request:
  push:
    branches:
      - v1.x

permissions:
  contents: read # Default to 'read' for security
  pull-requests: read
  id-token: write # Added for potential OIDC in release job (packages/registry login)

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        font_variant: [full, minimal]

    # No write permissions here: Dependabot-triggered runs get GITHUB_TOKEN
    # blanked out (breaking even checkout) if the job requests write scopes
    # it isn't allowed to have. The patch commit/comment steps that need
    # write access live in the `apply-patch` job instead.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.font_variant }}-${{ github.event_name }}
      cancel-in-progress: true

    outputs:
      patch-diff: ${{ steps.patch_diff_step.outputs.diff }}

    steps:
      - name: Checkout Source Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}
          token: ${{ secrets.GH_TOKEN || github.token }}

      - uses: rlespinasse/github-slug-action@ef93b2ea4b6405d06fd8684fc3ff795d262ecae8 # v5.7.0

      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: just

      - name: Build Docker Image (${{ matrix.font_variant }})
        run: just build
        env:
          DOCKER_IMAGE: ${{ github.repository }}:${{ env.GITHUB_REF_SLUG }}-${{ matrix.font_variant }}
          FONT_VARIANT: ${{ matrix.font_variant }}

      - name: Setup CI for test
        run: just test-ci-setup

      - name: Test Docker Image (${{ matrix.font_variant }})
        id: test_ci
        run: just test-ci
        env:
          DOCKER_IMAGE: ${{ github.repository }}:${{ env.GITHUB_REF_SLUG }}-${{ matrix.font_variant }}
        continue-on-error: true

      - name: Store Output Logs & Files
        if: steps.test_ci.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-artifacts-${{ matrix.font_variant }}
          path: |
            tests/output/*.log
            tests/data
            !tests/data/*.drawio
            !tests/data/*/*.drawio

      - name: Patch Code (if Test Failed)
        if: steps.test_ci.outcome == 'failure' && matrix.font_variant == 'full'
        run: just patch

      - name: Generate Patch Diff
        if: steps.test_ci.outcome == 'failure' && matrix.font_variant == 'full'
        id: patch_diff_step
        run: |
          git diff HEAD^ HEAD > patch.diff
          # Set output to be used by the comment action
          {
            echo "diff<<EOF"
            cat patch.diff
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  apply-patch:
    runs-on: ubuntu-latest

    needs: build

    # Dependabot-triggered runs never get write access to GITHUB_TOKEN, so
    # skip this job for them rather than fail on checkout.
    if: needs.build.outputs.patch-diff != '' && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'

    permissions:
      contents: write # For stefanzweifel/git-auto-commit-action
      pull-requests: write # For peter-evans/create-or-update-comment

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-apply-patch
      cancel-in-progress: true

    steps:
      - name: Checkout Source Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Apply Patch
        run: echo "${{ needs.build.outputs.patch-diff }}" | git apply -

      - name: Comment Patch Diff on PR
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            :warning: A patch has been applied following the tests failure.

            <details>
            <summary>Display patch content</summary>

            ```diff
            ${{ needs.build.outputs.patch-diff }}
            ```
            </details>
        continue-on-error: true

      - name: Commit and Push Patch
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "fix: apply automated patch after tests failure"
          branch: ${{ github.head_ref }}

  build-multiarch:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        font_variant: [full, minimal]

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-multiarch-${{ matrix.font_variant }}-${{ github.event_name }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: rlespinasse/github-slug-action@ef93b2ea4b6405d06fd8684fc3ff795d262ecae8 # v5.7.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: "arm64,arm"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.font_variant }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.font_variant }}-

      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: just

      - name: Build Docker Image (${{ matrix.font_variant }})
        run: just build-multiarch
        env:
          DOCKER_IMAGE: ${{ github.repository }}:${{ env.GITHUB_REF_SLUG }}-${{ matrix.font_variant }}
          FONT_VARIANT: ${{ matrix.font_variant }}

  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required for releases
      packages: write # Required to push packages/images to GHCR
      issues: write # If release-that creates issues

    needs:
      - build
      - build-multiarch

    # Concurrency is good here, but cancellation should be disabled so a push
    # doesn't cancel a running release.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release this docker image
        uses: rlespinasse/release-that@cb1bc2bf712d0fb87c82867852abb1b5128554fb # v1.16.0
        with:
          github-token: ${{ secrets.GH_TOKEN }}
