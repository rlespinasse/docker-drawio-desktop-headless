---
name: Build And Release

on:
  pull_request:
  push:
    branches:
      - v1.x

permissions:
  contents: write # Required to commit and push with git-auto-commit-action
  pull-requests: write # Required to comment on PRs with peter-evans/create-or-update-comment

jobs:
  build:
    runs-on: ubuntu-latest

    concurrency:
      group: build-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v6
        with:
          # 1. If it's a Pull Request, checkout the "head" (source) branch name.
          # 2. If it's a Push (or anything else), pass an empty string 
          #    (which tells the action to use the default behavior/SHA).
          ref: ${{ env.GITHUB_HEAD_REF || env.GITHUB_REF }}

      - uses: rlespinasse/github-slug-action@v5

      - uses: taiki-e/install-action@just

      - name: Build docker image
        run: just build
        shell: bash
        env:
          DOCKER_IMAGE: ${{ github.repository }}:${{ env.GITHUB_REF_SLUG }}

      - name: Setup CI for test
        run: just test-ci-setup
        shell: bash

      - name: Test docker image
        id: test-ci
        run: just test-ci
        shell: bash
        env:
          DOCKER_IMAGE: ${{ github.repository }}:${{ env.GITHUB_REF_SLUG }}

      - name: Test docker image // Store output logs
        uses: actions/upload-artifact@v5
        with:
          name: test-docker-image-logs
          path: "tests/output/*.log"
        if: always()

      - name: Test docker image // Store output files
        uses: actions/upload-artifact@v5
        with:
          name: test-docker-image-files
          path: |
            tests/data
            !tests/data/*.drawio
            !tests/data/*/*.drawio
        if: always()

      - name: Patch // if 'Test docker image' failed
        run: just patch
        shell: bash
        if: failure() && steps.test-ci.outcome == 'failure'

      - name: Generate patch diff // if 'Test docker image' failed
        run: git diff HEAD^ HEAD > patch.diff
        shell: bash
        if: failure() && steps.test-ci.outcome == 'failure'

      - name: Set patch diff output // if 'Test docker image' failed
        id: patch_diff
        run: |
          {
            echo "diff<<EOF"
            cat patch.diff
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        if: failure() && steps.test-ci.outcome == 'failure'

      - name: Comment patch diff on PR // if 'Test docker image' failed
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            :warning: A patch have been applied following the tests failure.

            <details>
            <summary>Display patch content</summary>

            ```diff
            ${{ steps.patch_diff.outputs.diff }}
            ```
            </details>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        if: failure() && steps.test-ci.outcome == 'failure' && github.event_name == 'pull_request' && steps.patch_diff.outputs.diff != ''

      - name: Commit and push patch if needed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix: apply automated patch after tests failure"
          branch: ${{ github.ref_name }}
        if: failure() && steps.test-ci.outcome == 'failure'

  build-multiarch:
    runs-on: ubuntu-latest

    concurrency:
      group: build-multiarch-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v6

      - uses: rlespinasse/github-slug-action@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: "arm64,arm"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - uses: taiki-e/install-action@just

      - name: Build docker image
        run: just build-multiarch
        shell: bash
        env:
          DOCKER_IMAGE: ${{ github.repository }}:${{ env.GITHUB_REF_SLUG }}

  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      id-token: write
      packages: write

    needs:
      - build
      - build-multiarch

    concurrency:
      group: release-${{ github.ref }}-${{ github.event_name }}

    steps:
      - uses: actions/checkout@v6

      - name: Release this docker image
        uses: rlespinasse/release-that@v1
        with:
          github-token: ${{ secrets.GH_TOKEN }}
