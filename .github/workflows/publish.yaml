---
name: Publish to Registry

on:
  release:
    types: [published]

permissions: read-all

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - font_variant: full
            tags: "latest,${{ github.event.release.tag_name }}"
          - font_variant: minimal
            tags: "minimal,minimal-${{ github.event.release.tag_name }}"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: rlespinasse/github-slug-action@e6f261660910b273384c5c42b17a0217881b217a # v5.6.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
        with:
          platforms: "arm64,arm"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Publish to Registry (${{ matrix.font_variant }})
        uses: elgohr/Publish-Docker-Github-Action@1c2f28ccd9476e8a936ac9a1f287405504c93304 # v5
        with:
          name: rlespinasse/drawio-desktop-headless
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          tags: ${{ matrix.tags }}
          platforms: linux/amd64,linux/arm64
          buildargs: FONT_VARIANT=${{ matrix.font_variant }}
