---
name: Publish to Registry

on:
  release:
    types: [published]

permissions: read-all

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - font_variant: full
            tags: "latest,${{ github.event.release.tag_name }}"
          - font_variant: minimal
            tags: "minimal,minimal-${{ github.event.release.tag_name }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: rlespinasse/github-slug-action@ef93b2ea4b6405d06fd8684fc3ff795d262ecae8 # v5.7.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: "arm64,arm"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Publish to Registry (${{ matrix.font_variant }})
        uses: elgohr/Publish-Docker-Github-Action@1c2f28ccd9476e8a936ac9a1f287405504c93304 # v5
        with:
          name: rlespinasse/drawio-desktop-headless
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          tags: ${{ matrix.tags }}
          platforms: linux/amd64,linux/arm64
          buildargs: FONT_VARIANT=${{ matrix.font_variant }}
