---
name: Publish to Registry

on:
  release:
    types: [published]

permissions: read-all

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - font_variant: full
            tags: "latest,${{ github.event.release.tag_name }}"
          - font_variant: minimal
            tags: "minimal,minimal-${{ github.event.release.tag_name }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: rlespinasse/github-slug-action@0e3299190dac9a700da92a90de4556116ea965ed # v5.7.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: "arm64,arm"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Publish to Registry (${{ matrix.font_variant }})
        uses: elgohr/Publish-Docker-Github-Action@1c2f28ccd9476e8a936ac9a1f287405504c93304 # v5
        with:
          name: rlespinasse/drawio-desktop-headless
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          tags: ${{ matrix.tags }}
          platforms: linux/amd64,linux/arm64
          buildargs: FONT_VARIANT=${{ matrix.font_variant }}
