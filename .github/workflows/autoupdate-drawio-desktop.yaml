---
name: Autoupdate Drawio Desktop

on:
  schedule:
    - cron: "0 0 * * 1" # Every Monday at midnight (UTC)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autoupdate-drawio-desktop
  cancel-in-progress: true

jobs:
  autoupdate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - run: just autoupdate-drawio-desktop
        id: autoupdate-drawio-desktop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash

      - uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          title: "feat: update to drawio-desktop ${{ steps.autoupdate-drawio-desktop.outputs.release_version }}"
          body: ${{ steps.autoupdate-drawio-desktop.outputs.release_notes }}
          commit-message: |
            feat: update to drawio-desktop ${{ steps.autoupdate-drawio-desktop.outputs.release_version }}

            ${{ steps.autoupdate-drawio-desktop.outputs.release_notes }}
          branch: autoupdate-drawio-desktop
          token: ${{ secrets.GH_TOKEN }}
