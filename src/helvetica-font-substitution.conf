<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fontconfig substitution rules to map Helvetica (and variants)
  to Liberation Sans, which is metrically compatible.
  See: https://github.com/rlespinasse/docker-drawio-desktop-headless/issues/84
-->
<fontconfig>
  <alias binding="same">
    <family>Helvetica</family>
    <prefer>
      <family>Liberation Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Helvetica Neue</family>
    <prefer>
      <family>Liberation Sans</family>
    </prefer>
  </alias>
</fontconfig>
